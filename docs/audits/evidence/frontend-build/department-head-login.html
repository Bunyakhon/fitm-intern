  <body class="login-page" data-auth-role="department_head">
    <header class="navbar"><div class="nav-container">
      <a href="/index.html" class="brand"><img src="/assets/logo_kiwi-Dov6wizJ.png" alt="KIWI" class="brand-logo" /><span>ระบบจัดการสหกิจศึกษา</span></a>
      <a href="/teacher-login.html" class="btn-login">เข้าสู่ระบบอาจารย์</a>
    </div></header>
    <main class="auth-wrapper"><div class="auth-card">
      <div class="auth-header"><h1>เข้าสู่ระบบหัวหน้าภาควิชา</h1><p>พิจารณาคำร้องสหกิจที่ผ่านอาจารย์ที่ปรึกษาประจำชั้นแล้ว</p></div>
      <form class="auth-form" id="teacherLoginForm" aria-describedby="teacherLoginMessage">
        <div class="form-group"><label for="teacherEmail">อีเมล</label><div class="input-icon-wrapper"><input id="teacherEmail" name="email" type="email" maxlength="254" placeholder="กรอกอีเมล" autocomplete="username" required /></div></div>
        <div class="form-group"><label for="teacherPassword">รหัสผ่าน</label><div class="input-icon-wrapper"><input id="teacherPassword" name="password" type="password" placeholder="กรอกรหัสผ่าน" autocomplete="current-password" required /></div></div>
        <button class="btn-submit" type="submit">เข้าสู่ระบบ</button>
        <p id="teacherLoginMessage" class="login-message" role="status" aria-live="polite"></p>
      </form>
    </div></main>
  </body>

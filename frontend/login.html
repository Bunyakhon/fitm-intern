<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>เข้าสู่ระบบ | KIWI</title>

    <link rel="stylesheet" href="/src/styles/main.css" />
    <link rel="stylesheet" href="/src/styles/auth.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Sarabun:wght@500;600;700&family=Noto+Sans+Thai:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>

  <body class="login-page">
    <!-- ========================= -->
    <!-- Navbar -->
    <!-- ========================= -->

    <header class="navbar">
      <div class="nav-container">
        <a href="index.html" class="brand">
          <img src="/images/logo_kiwi.png" alt="KIWI Logo" class="brand-logo" />

          <span>ระบบจัดการสหกิจศึกษา</span>
        </a>

        <div class="auth-buttons">
          <a href="register.html" class="btn-login">
            ยังไม่มีบัญชี? สมัครสมาชิก
          </a>
        </div>
      </div>
    </header>

    <!-- ========================= -->
    <!-- Login -->
    <!-- ========================= -->

    <main class="auth-wrapper">
      <div class="auth-card">
        <!-- Header -->

        <div class="auth-header">
          <h1>เข้าสู่ระบบ</h1>

          <p>เข้าสู่ระบบ KIWI เพื่อใช้งานระบบจัดการสหกิจศึกษา</p>
        </div>

        <!-- ========================= -->
        <!-- Google Login -->
        <!-- ========================= -->

        <button type="button" class="btn-google" id="googleLoginBtn">
          <svg class="google-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="#4285F4"
              d="M23.49 12.27c0-.79-.07-1.54-.19-2.27H12v4.51h6.47c-.29 1.48-1.14 2.73-2.4 3.58v3h3.86c2.26-2.09 3.56-5.17 3.56-8.82z"
            />

            <path
              fill="#34A853"
              d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.86-3c-1.08.72-2.45 1.15-4.07 1.15-3.13 0-5.78-2.11-6.73-4.96H1.29v3.09C3.26 21.3 7.31 24 12 24z"
            />

            <path
              fill="#FBBC05"
              d="M5.27 14.28A7.2 7.2 0 0 1 4.87 12c0-.79.14-1.57.4-2.28V6.63H1.29A11.98 11.98 0 0 0 0 12c0 1.93.46 3.76 1.29 5.37l3.98-3.09z"
            />

            <path
              fill="#EA4335"
              d="M12 4.75c1.76 0 3.34.61 4.58 1.8l3.43-3.43C17.94 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.63l3.98 3.09C6.22 6.86 8.87 4.75 12 4.75z"
            />
          </svg>

          <span> เข้าสู่ระบบด้วยบัญชี Google (KMUTNB) </span>
        </button>

        <!-- Divider -->

        <div class="divider">
          <span>หรือเข้าสู่ระบบด้วยอีเมล</span>
        </div>

        <!-- ========================= -->
        <!-- Login Form -->
        <!-- ========================= -->

        <form class="auth-form" id="loginForm">
          <!-- Email -->

          <div class="form-group">
            <label for="loginEmail"> อีเมล </label>

            <div class="input-icon-wrapper">
              <i class="fa-solid fa-envelope input-icon"></i>

              <input
                type="email"
                id="loginEmail"
                name="loginEmail"
                placeholder="กรอกอีเมล"
                autocomplete="email"
                required
              />
            </div>
          </div>

          <!-- Password -->

          <div class="form-group">
            <label for="loginPassword"> รหัสผ่าน </label>

            <div class="input-icon-wrapper">
              <i class="fa-solid fa-lock input-icon"></i>

              <input
                type="password"
                id="loginPassword"
                name="loginPassword"
                placeholder="กรอกรหัสผ่าน"
                autocomplete="current-password"
                required
              />

              <button
                type="button"
                class="toggle-password"
                id="togglePassword"
                aria-label="แสดงหรือซ่อนรหัสผ่าน"
              >
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
          </div>

          <!-- Action -->

          <div class="form-actions">
            <label class="remember-me">
              <input type="checkbox" id="rememberMe" />

              <span> จำฉันไว้ในระบบ </span>
            </label>

            <a href="#" class="forgot-password"> ลืมรหัสผ่าน? </a>
          </div>

          <!-- Login button -->

          <button type="submit" class="btn-submit">
            <i class="fa-solid fa-right-to-bracket"></i>

            <span> เข้าสู่ระบบ </span>
          </button>

          <!-- Error -->

          <div class="login-message" id="loginMessage" role="alert"></div>
        </form>

        <!-- Footer -->

        <p class="auth-footer">
          ยังไม่มีบัญชีผู้ใช้?

          <a href="register.html"> สมัครสมาชิกที่นี่ </a>
        </p>
      </div>
    </main>

    <!-- ========================= -->
    <!-- Footer -->
    <!-- ========================= -->

    <footer class="footer">
      <div class="footer-copyright">
        <p>© KIWI — Co-operative Education Management System</p>
      </div>
    </footer>

    <script type="module" src="/src/pages/login.js"></script>
  </body>
</html>

<!doctype html>
<html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>เข้าสู่ระบบเจ้าหน้าที่ | KIWI</title><link rel="stylesheet" href="/src/styles/main.css"><link rel="stylesheet" href="/src/styles/auth.css"></head>
<body class="login-page" data-auth-role="department_staff"><header class="navbar"><div class="nav-container"><a href="/index.html" class="brand"><img src="/images/logo_kiwi.png" alt="KIWI" class="brand-logo"><span>ระบบจัดการสหกิจศึกษา</span></a><a href="/login.html" class="btn-login">เข้าสู่ระบบนักศึกษา</a></div></header>
<main class="auth-wrapper"><div class="auth-card"><div class="auth-header"><h1>เข้าสู่ระบบเจ้าหน้าที่</h1><p>จัดการเอกสารของคำร้องที่ผ่านการอนุมัติแล้ว</p></div>
<form class="auth-form" id="staffLoginForm" aria-describedby="staffLoginMessage"><div class="form-group"><label for="staffEmail">อีเมล</label><input id="staffEmail" type="email" maxlength="254" autocomplete="username" required></div><div class="form-group"><label for="staffPassword">รหัสผ่าน</label><input id="staffPassword" type="password" autocomplete="current-password" required></div><button class="btn-submit" type="submit">เข้าสู่ระบบ</button><p id="staffLoginMessage" role="alert" aria-live="polite"></p></form></div></main><script type="module" src="/src/pages/staffLogin.js"></script></body></html>

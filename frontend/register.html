<!doctype html>

<html lang="th">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>สมัครสมาชิก | KIWI</title>

    <link rel="stylesheet" href="/src/styles/main.css" />

    <link rel="stylesheet" href="/src/styles/auth.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>

  <body class="register-page" data-auth-role="student">
    <!-- Navbar -->
    <header class="navbar">
      <div class="nav-container">
        <a href="index.html" class="brand">
          <img
            src="/images/logo_kiwi.png"
            alt="KIWI Logo"
            class="brand-logo"
          />

          <span>ระบบจัดการสหกิจศึกษา</span>
        </a>

        <div class="auth-buttons">
          <a href="login.html" class="btn-login">
            มีบัญชีแล้ว? เข้าสู่ระบบ
          </a>
        </div>
      </div>
    </header>

    <!-- Register -->
    <main class="auth-wrapper">
      <div class="auth-card">
        <div class="auth-header">
          <h1>สมัครสมาชิก</h1>

          <p>สมัครใช้งานระบบ KIWI สำหรับนักศึกษาสหกิจศึกษา</p>
        </div>

        <section id="googleLogin" class="google-login" aria-label="สมัครหรือเข้าสู่ระบบด้วย Google">
          <button type="button" class="btn-google" id="googleLoginBtn" aria-describedby="googleLoginMessage">
            <svg class="google-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="#4285F4" d="M23.49 12.27c0-.79-.07-1.54-.19-2.27H12v4.51h6.47c-.29 1.48-1.14 2.73-2.4 3.58v3h3.86c2.26-2.09 3.56-5.17 3.56-8.82z" />
              <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.86-3c-1.08.72-2.45 1.15-4.07 1.15-3.13 0-5.78-2.11-6.73-4.96H1.29v3.09C3.26 21.3 7.31 24 12 24z" />
              <path fill="#FBBC05" d="M5.27 14.28A7.2 7.2 0 0 1 4.87 12c0-.79.14-1.57.4-2.28V6.63H1.29A11.98 11.98 0 0 0 0 12c0 1.93.46 3.76 1.29 5.37l3.98-3.09z" />
              <path fill="#EA4335" d="M12 4.75c1.76 0 3.34.61 4.58 1.8l3.43-3.43C17.94 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.63l3.98 3.09C6.22 6.86 8.87 4.75 12 4.75z" />
            </svg>
            <span>ดำเนินการต่อด้วย Google</span>
          </button>
        </section>

        <div class="divider" id="googleDivider">
          <span>หรือสมัครด้วยอีเมลและรหัสผ่าน</span>
        </div>

        <form class="auth-form" id="registerForm" aria-describedby="registerMessage">
          <!-- First Name -->
          <div class="form-group">
            <label for="regFirstName">
              ชื่อ (ภาษาไทย)
            </label>

            <div class="input-icon-wrapper">
              <i class="fa-solid fa-user input-icon"></i>

              <input
                type="text"
                id="regFirstName"
                maxlength="255"
                name="regFirstName"
                placeholder="กรอกชื่อภาษาไทย"
                autocomplete="given-name"
                aria-describedby="registerMessage"
                required
              />
            </div>
          </div>

          <!-- Last Name -->
          <div class="form-group">
            <label for="regLastName">
              นามสกุล (ภาษาไทย)
            </label>

            <div class="input-icon-wrapper">
              <i class="fa-solid fa-user input-icon"></i>

              <input
                type="text"
                id="regLastName"
                maxlength="255"
                name="regLastName"
                placeholder="กรอกนามสกุลภาษาไทย"
                autocomplete="family-name"
                aria-describedby="registerMessage"
                required
              />
            </div>
          </div>

          <!-- Email -->
          <div class="form-group">
            <label for="regEmail">
              อีเมลมหาวิทยาลัย
            </label>

            <div class="input-icon-wrapper">
              <i class="fa-solid fa-envelope input-icon"></i>

              <input
                type="email"
                id="regEmail"
                maxlength="254"
                name="regEmail"
                placeholder="เช่น s6706022510107@email.kmutnb.ac.th"
                autocomplete="email"
                aria-describedby="registerMessage"
                required
              />
            </div>
          </div>

          <!-- Password -->
          <div class="form-group">
            <label for="regPassword">
              รหัสผ่าน
            </label>

            <div class="input-icon-wrapper">
              <i class="fa-solid fa-lock input-icon"></i>

              <input
                type="password"
                id="regPassword"
                maxlength="72"
                name="regPassword"
                placeholder="อย่างน้อย 8 ตัวอักษร"
                minlength="8"
                autocomplete="new-password"
                aria-describedby="registerMessage"
                required
              />

              <button
                type="button"
                class="toggle-password"
                id="toggleRegPassword"
                aria-label="แสดงหรือซ่อนรหัสผ่าน"
                aria-pressed="false"
              >
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
          </div>

          <!-- Confirm Password -->
          <div class="form-group">
            <label for="regConfirm">
              ยืนยันรหัสผ่าน
            </label>

            <div class="input-icon-wrapper">
              <i class="fa-solid fa-lock input-icon"></i>

              <input
                type="password"
                id="regConfirm"
                maxlength="72"
                name="regConfirm"
                placeholder="กรอกรหัสผ่านอีกครั้ง"
                autocomplete="new-password"
                aria-describedby="registerMessage"
                required
              />

              <button
                type="button"
                class="toggle-password"
                id="toggleRegConfirm"
                aria-label="แสดงหรือซ่อนรหัสผ่าน"
                aria-pressed="false"
              >
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
          </div>

          <!-- Submit -->
          <button
            type="submit"
            class="btn-submit"
            id="registerSubmitBtn"
          >
            <i class="fa-solid fa-user-plus"></i>

            <span>สมัครสมาชิก</span>
          </button>

          <div
            class="register-message"
            id="registerMessage"
            role="status"
            aria-live="polite"
          ></div>
        </form>

        <p class="auth-footer">
          มีบัญชีผู้ใช้งานอยู่แล้ว?

          <a href="login.html">
            เข้าสู่ระบบที่นี่
          </a>
        </p>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <div class="footer-copyright">
        <p>
          © KIWI — Co-operative Education Management System
        </p>
      </div>
    </footer>

    <script
      type="module"
      src="/src/pages/register.js"
    ></script>
    <script type="module" src="/src/pages/googleLogin.js"></script>
  </body>
</html>

services:

  postgres:
    image: postgres:16-alpine
    container_name: intern_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: intern_system

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d intern_system"]
      interval: 5s
      timeout: 5s
      retries: 5


  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: intern_pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"

    ports:
      - "5050:80"

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    depends_on:
      postgres:
        condition: service_healthy


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: intern_backend
    restart: unless-stopped

    environment:
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: intern_system
      DB_USER: postgres
      DB_PASSWORD: postgres

    ports:
      - "5000:5000"

    volumes:
      - ./backend:/app
      - /app/node_modules
      - intern_storage:/app/storage

    depends_on:
      postgres:
        condition: service_healthy

    command: npm run dev


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: intern_frontend
    restart: unless-stopped

    environment:
      VITE_API_URL: http://localhost:5000
      CHOKIDAR_USEPOLLING: "true"

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    depends_on:
      - backend

    command: npm run dev -- --host 0.0.0.0


  nlp-service:
    build:
      context: ./nlp-service
      dockerfile: Dockerfile

    container_name: intern_nlp_service
    restart: unless-stopped

    environment:
      PORT: 8000

    ports:
      - "8000:8000"

    volumes:
      - ./nlp-service/app:/app/app
      - ./nlp-service/data:/app/data

    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload


volumes:
  postgres_data:
  pgadmin_data:
  intern_storage:
